name: Apply D1 migrations

# Manual only: applies pending files in migrations/ to the production learner database.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-englishcamp-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'yahyanaim/EnglishCamp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: List and apply pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 196c66b2735e6fbccbc6a302813f5e04
        run: |
          npx wrangler d1 migrations list englishcamp-learners --remote
          npx wrangler d1 migrations apply englishcamp-learners --remote
