name: Deploy EnglishCamp to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-englishcamp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'yahyanaim/EnglishCamp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Export all courses and practice pages
        run: npm run build:cloudflare

      - name: Test the application and exported routes
        run: npm test

      - name: Check the Worker bundle
        run: npm run check:cloudflare

      - name: Deploy the existing EnglishCamp Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 196c66b2735e6fbccbc6a302813f5e04
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'
            exit 1
          fi
          npm run deploy:cloudflare

      - name: Verify live pages and Microsoft pronunciation
        run: node scripts/check-cloudflare-live.cjs

      - name: Record the deployment result
        run: |
          echo 'EnglishCamp deployed from the pushed main commit.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live site: https://englishcamp.yahyanaim2001.workers.dev/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public pages and real Microsoft pronunciation passed verification.' >> "$GITHUB_STEP_SUMMARY"
