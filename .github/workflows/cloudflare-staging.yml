name: Deploy EnglishCamp staging

# Free staging copy: a separate Worker (englishcamp-staging) with its own D1 database.
# Runs only for the `staging` branch, so production and its learner data are never touched.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-englishcamp-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.repository == 'yahyanaim/EnglishCamp' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      CLOUDFLARE_ACCOUNT_ID: 196c66b2735e6fbccbc6a302813f5e04
      STAGING_DATABASE: englishcamp-staging-learners
      STAGING_URL: https://englishcamp-staging.yahyanaim2001.workers.dev
    steps:
      - name: Check out the staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Export all pages
        run: npm run build:cloudflare

      - name: Test the application and exported routes
        run: npm test

      - name: Find or create the staging D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Missing CLOUDFLARE_STAGING_API_TOKEN / CLOUDFLARE_API_TOKEN repository secret.'; exit 1; fi
          lookup() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.env.STAGING_DATABASE);process.stdout.write(db?db.uuid:"")})'; }
          id="$(lookup)"
          if [ -z "$id" ]; then
            npx wrangler d1 create "$STAGING_DATABASE"
            id="$(lookup)"
          fi
          if [ -z "$id" ]; then echo 'Could not find or create the staging database.'; exit 1; fi
          node scripts/staging-config.cjs "$id"

      - name: Apply D1 migrations to the staging database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply "$STAGING_DATABASE" --remote --config wrangler.staging.generated.jsonc

      - name: Deploy the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy --config wrangler.staging.generated.jsonc || {
            echo '::error::Deploy refused. The API token must be allowed to create Workers on this account (Account → Workers Scripts: Edit, plus D1: Edit). Add such a token as the CLOUDFLARE_STAGING_API_TOKEN repository secret, then re-run.'
            exit 1
          }

      - name: Copy staging-only secrets that are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          INVITATION_ADMIN_HASH: ${{ secrets.STAGING_INVITATION_ADMIN_HASH }}
          ADMIN_TOTP_SECRET: ${{ secrets.STAGING_ADMIN_TOTP_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.STAGING_PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.STAGING_PAYPAL_CLIENT_SECRET }}
          PAYPAL_PLAN_ID: ${{ secrets.STAGING_PAYPAL_PLAN_ID }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.STAGING_PAYPAL_WEBHOOK_ID }}
          BREVO_API_KEY: ${{ secrets.STAGING_BREVO_API_KEY }}
          INVITATION_EMAIL_FROM: ${{ secrets.STAGING_INVITATION_EMAIL_FROM }}
        run: |
          file="$RUNNER_TEMP/staging-secrets.json"
          umask 077
          node -e 'const names=["INVITATION_ADMIN_HASH","ADMIN_TOTP_SECRET","PAYPAL_CLIENT_ID","PAYPAL_CLIENT_SECRET","PAYPAL_PLAN_ID","PAYPAL_WEBHOOK_ID","BREVO_API_KEY","INVITATION_EMAIL_FROM"];const out={};for(const n of names)if(process.env[n])out[n]=process.env[n];require("fs").writeFileSync(process.argv[1],JSON.stringify(out));console.log("Staging secrets present: "+(Object.keys(out).join(", ")||"none"));' "$file"
          if [ "$(cat "$file")" != "{}" ]; then npx wrangler secret bulk "$file" --config wrangler.staging.generated.jsonc; fi
          rm -f "$file"

      - name: Check that staging answers and is not indexable
        run: |
          for i in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$STAGING_URL/invite")" && [ "$code" = 200 ] && break
            sleep 10
          done
          [ "$code" = 200 ] || { echo "Staging /invite returned $code"; exit 1; }
          curl -sI "$STAGING_URL/invite" | grep -qi '^x-robots-tag: noindex' || { echo 'Staging is missing X-Robots-Tag: noindex'; exit 1; }
          echo "Staging deployed: $STAGING_URL (separate Worker and database, PayPal sandbox, speech off)." >> "$GITHUB_STEP_SUMMARY"
