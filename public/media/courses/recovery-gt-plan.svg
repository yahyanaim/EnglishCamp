<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Community centre listening plan: labels A to D</title><desc id="desc">North is at the top. An entrance at the bottom connects to a central corridor. A lies west of the corridor, B to its east, C at its north end, and D in the north-west corner. Supply room names from the recording.</desc><rect width="800" height="450" fill="white"/><g font-family="DM Sans, Arial, sans-serif" fill="#0f172a"><text x="400" y="35" font-size="24" text-anchor="middle">Community centre · North ↑</text><path d="M400 380V80" stroke="#cbd5e1" stroke-width="70"/><g stroke="#0ea5e9" stroke-width="2" fill="#e0f2fe"><rect x="70" y="70" width="245" height="95" rx="8"/><rect x="330" y="70" width="140" height="95" rx="8"/><rect x="70" y="210" width="245" height="95" rx="8"/><rect x="485" y="210" width="245" height="95" rx="8"/><rect x="315" y="350" width="170" height="65" rx="8"/></g><g font-size="28" text-anchor="middle" font-weight="700"><text x="192" y="128">D</text><text x="400" y="128">C</text><text x="192" y="268">A</text><text x="607" y="268">B</text></g><text x="400" y="392" font-size="20" text-anchor="middle">Entrance</text><text x="400" y="325" font-size="14" text-anchor="middle">Corridor</text></g></svg>
