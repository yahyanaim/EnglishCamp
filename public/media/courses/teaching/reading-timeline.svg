<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">Activity connected to now</title><desc id="desc">Reading begins at ten and is still in progress at noon. The duration is two hours; completion is not established.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0369A1"/></marker></defs><rect width="480" height="330" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="24" y="36" font-size="24" fill="#0f172a" text-anchor="start">Activity connected to now</text><text x="24" y="82" font-size="25" fill="#0f172a" text-anchor="start">I have been reading for two</text><text x="24" y="114" font-size="25" fill="#0f172a" text-anchor="start">hours.</text><text x="24" y="145" font-size="20" fill="#0f172a" text-anchor="start">Started</text><text x="355" y="145" font-size="20" fill="#0f172a" text-anchor="start">Still reading</text><path d="M56 195 L430 195" fill="none" stroke="#0369A1" stroke-width="3" marker-end="url(#arrow)"/><circle cx="56" cy="195" r="6" fill="#0369A1"/><text x="56" y="232" font-size="22" fill="#0f172a" text-anchor="middle">10:00</text><circle cx="240" cy="195" r="6" fill="#0369A1"/><text x="240" y="232" font-size="22" fill="#0f172a" text-anchor="middle">11:00</text><circle cx="424" cy="195" r="6" fill="#0369A1"/><text x="424" y="232" font-size="22" fill="#0f172a" text-anchor="middle">12:00</text><text x="424" y="270" font-size="21" fill="#0369A1" text-anchor="middle">NOW</text><text x="24" y="305" font-size="20" fill="#0f172a" text-anchor="start">Duration does not mean completion.</text></g></svg>
