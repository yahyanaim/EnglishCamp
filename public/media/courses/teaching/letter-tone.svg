<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="title desc"><title id="title">Audience shapes the tone</title><desc id="desc">A formal request to a landlord and a friendly request to Sam both identify a leaking tap and ask for help.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0369A1"/></marker></defs><rect width="480" height="420" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="24" y="36" font-size="24" fill="#0f172a" text-anchor="start">Audience shapes the tone</text><rect x="24" y="75" width="432" height="135" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="108" font-size="23" fill="#0369A1" text-anchor="start">To a landlord</text><text x="40" y="144" font-size="23" fill="#0f172a" text-anchor="start">Could you arrange a repair for</text><text x="40" y="174" font-size="23" fill="#0f172a" text-anchor="start">the leaking kitchen tap?</text><rect x="24" y="235" width="432" height="135" rx="12" fill="#F7F7F7" stroke="#CBD5E1"/><text x="40" y="268" font-size="23" fill="#0369A1" text-anchor="start">To a close friend</text><text x="40" y="304" font-size="23" fill="#0f172a" text-anchor="start">Could you come round and help me</text><text x="40" y="334" font-size="23" fill="#0f172a" text-anchor="start">check the kitchen tap?</text><text x="24" y="401" font-size="20" fill="#0f172a" text-anchor="start">Same purpose; different relationship.</text></g></svg>
