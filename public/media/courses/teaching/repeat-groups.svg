<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 370" role="img" aria-labelledby="title desc"><title id="title">Rehearse in meaning groups</title><desc id="desc">Please leave your bags / beside the front desk. Preserve exact words rather than paraphrasing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0369A1"/></marker></defs><rect width="480" height="370" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="24" y="36" font-size="24" fill="#0f172a" text-anchor="start">Rehearse in meaning groups</text><rect x="24" y="80" width="432" height="90" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="119" font-size="27" fill="#0369A1" text-anchor="start">Please leave your bags</text><text x="40" y="151" font-size="19" fill="#0f172a" text-anchor="start">Keep please and the plural ending.</text><path d="M240 177 L240 209" fill="none" stroke="#0369A1" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="219" width="432" height="90" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="258" font-size="27" fill="#0369A1" text-anchor="start">beside the front desk.</text><text x="40" y="290" font-size="19" fill="#0f172a" text-anchor="start">Keep the complete location phrase.</text><text x="24" y="346" font-size="21" fill="#0f172a" text-anchor="start">Repetition keeps the heard wording.</text></g></svg>
