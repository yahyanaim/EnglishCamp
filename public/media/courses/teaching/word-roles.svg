<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="title desc"><title id="title">One family, three sentence roles</title><desc id="desc">Patient is an adjective, patiently an adverb, patience a noun. The sentence role controls the form.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0369A1"/></marker></defs><rect width="480" height="420" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="24" y="36" font-size="24" fill="#0f172a" text-anchor="start">One family, three sentence roles</text><rect x="24" y="70" width="432" height="92" rx="12" fill="#F7F7F7" stroke="#CBD5E1"/><text x="40" y="99" font-size="20" fill="#0369A1" text-anchor="start">Adjective</text><text x="205" y="99" font-size="25" fill="#0f172a" text-anchor="start">patient</text><text x="40" y="135" font-size="23" fill="#0f172a" text-anchor="start">a patient volunteer</text><rect x="24" y="176" width="432" height="92" rx="12" fill="#F7F7F7" stroke="#CBD5E1"/><text x="40" y="205" font-size="20" fill="#0369A1" text-anchor="start">Adverb</text><text x="205" y="205" font-size="25" fill="#0f172a" text-anchor="start">patiently</text><text x="40" y="241" font-size="23" fill="#0f172a" text-anchor="start">answered patiently</text><rect x="24" y="282" width="432" height="92" rx="12" fill="#F7F7F7" stroke="#CBD5E1"/><text x="40" y="311" font-size="20" fill="#0369A1" text-anchor="start">Noun</text><text x="205" y="311" font-size="25" fill="#0f172a" text-anchor="start">patience</text><text x="40" y="347" font-size="23" fill="#0f172a" text-anchor="start">showed patience</text></g></svg>
