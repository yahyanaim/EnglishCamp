<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="title desc"><title id="title">Find the main subject head</title><desc id="desc">The course that includes field visits helps students. Course controls helps; visits is inside the relative clause.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0369A1"/></marker></defs><rect width="480" height="420" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="24" y="36" font-size="24" fill="#0f172a" text-anchor="start">Find the main subject head</text><rect x="24" y="75" width="432" height="80" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="108" font-size="28" fill="#0369A1" text-anchor="start">The course</text><text x="40" y="139" font-size="20" fill="#0f172a" text-anchor="start">Main subject head: singular</text><rect x="24" y="177" width="432" height="80" rx="12" fill="#F7F7F7" stroke="#CBD5E1"/><text x="40" y="210" font-size="25" fill="#0f172a" text-anchor="start">that includes field visits</text><text x="40" y="241" font-size="19" fill="#0f172a" text-anchor="start">Modifier: does not control helps</text><rect x="24" y="279" width="432" height="80" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="313" font-size="28" fill="#0369A1" text-anchor="start">helps students.</text><text x="40" y="344" font-size="20" fill="#0f172a" text-anchor="start">Main verb agrees with course</text><path d="M445 150 L445 275" fill="none" stroke="#0369A1" stroke-width="3" marker-end="url(#arrow)"/></g></svg>
