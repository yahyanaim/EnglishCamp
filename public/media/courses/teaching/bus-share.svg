<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 370" role="img" aria-labelledby="title desc"><title id="title">20% to 30%: two valid measures</title><desc id="desc">The bus share rises by 10 percentage points, or by 50 percent relative to its original 20 percent share. Journey totals are unknown.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0369A1"/></marker></defs><rect width="480" height="370" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="24" y="36" font-size="24" fill="#0f172a" text-anchor="start">20% to 30%: two valid measures</text><text x="24" y="76" font-size="20" fill="#0f172a" text-anchor="start">Each whole bar = all journeys</text><text x="24" y="125" font-size="22" fill="#0f172a" text-anchor="start">Earlier</text><rect x="24" y="139" width="400" height="30" rx="12" fill="#F7F7F7" stroke="#CBD5E1"/><rect x="24" y="139" width="80" height="30" fill="#0369A1"/><text x="435" y="163" font-size="21" fill="#0f172a" text-anchor="end">20%</text><text x="24" y="215" font-size="22" fill="#0f172a" text-anchor="start">Later</text><rect x="24" y="229" width="400" height="30" rx="12" fill="#F7F7F7" stroke="#CBD5E1"/><rect x="24" y="229" width="120" height="30" fill="#0369A1"/><text x="435" y="253" font-size="21" fill="#0f172a" text-anchor="end">30%</text><text x="24" y="310" font-size="23" fill="#0f172a" text-anchor="start">Point change: 30 − 20 = 10</text><text x="24" y="345" font-size="22" fill="#0f172a" text-anchor="start">Relative change: 10 ÷ 20 = 50%</text></g></svg>
