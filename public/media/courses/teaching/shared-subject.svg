<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="title desc"><title id="title">Both actions share an actor</title><desc id="desc">Having checked the figures, the researcher revised the report. The researcher performs both actions, so there is no dangling modifier.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0369A1"/></marker></defs><rect width="480" height="420" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="24" y="36" font-size="24" fill="#0f172a" text-anchor="start">Both actions share an actor</text><rect x="24" y="74" width="432" height="94" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="109" font-size="24" fill="#0369A1" text-anchor="start">Having checked the figures,</text><text x="40" y="145" font-size="21" fill="#0f172a" text-anchor="start">Who checked? The researcher.</text><path d="M240 176 L240 207" fill="none" stroke="#0369A1" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="216" width="432" height="94" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="251" font-size="22" fill="#0369A1" text-anchor="start">the researcher revised the report.</text><text x="40" y="287" font-size="21" fill="#0f172a" text-anchor="start">Who revised? The researcher.</text><text x="24" y="357" font-size="22" fill="#0f172a" text-anchor="start">A report cannot check figures. Keep a</text><text x="24" y="386" font-size="22" fill="#0f172a" text-anchor="start">sensible shared actor.</text></g></svg>
