<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">Tell a story through its turning point</title><desc id="desc">An original story sequence: cancellation, coordinated response, arrival and reflection. Use your own experience for a personal answer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0369A1"/></marker></defs><rect width="480" height="480" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="24" y="36" font-size="24" fill="#0f172a" text-anchor="start">Tell a story through its turning point</text><rect x="24" y="65" width="432" height="76" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="93" font-size="23" fill="#0369A1" text-anchor="start">Problem</text><text x="40" y="122" font-size="20" fill="#0f172a" text-anchor="start">The train was cancelled</text><path d="M240 144 L240 159" fill="none" stroke="#0369A1" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="161" width="432" height="76" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="189" font-size="23" fill="#0369A1" text-anchor="start">Response</text><text x="40" y="218" font-size="20" fill="#0f172a" text-anchor="start">Find a bus; check closing time</text><path d="M240 240 L240 255" fill="none" stroke="#0369A1" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="257" width="432" height="76" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="285" font-size="23" fill="#0369A1" text-anchor="start">Outcome</text><text x="40" y="314" font-size="20" fill="#0f172a" text-anchor="start">Arrive with thirty minutes to spare</text><path d="M240 336 L240 351" fill="none" stroke="#0369A1" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="353" width="432" height="76" rx="12" fill="#E0F2FE" stroke="#CBD5E1"/><text x="40" y="381" font-size="23" fill="#0369A1" text-anchor="start">Reflection</text><text x="40" y="410" font-size="20" fill="#0f172a" text-anchor="start">Sharing the work helped us adapt</text></g></svg>
