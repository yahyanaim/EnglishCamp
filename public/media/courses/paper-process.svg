<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title"><title id="title">Original paper recycling process diagram</title><rect width="800" height="520" fill="white"/><g font-family="DM Sans, Arial, sans-serif"><text x="400" y="35" font-size="24" text-anchor="middle" fill="#0f172a">Recycling used paper into new paper</text><rect x="50" y="100" width="200" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><text x="150" y="143" font-size="22" text-anchor="middle" fill="#0f172a">Collect</text><rect x="290" y="100" width="200" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><text x="390" y="143" font-size="22" text-anchor="middle" fill="#0f172a">Sort</text><rect x="530" y="100" width="200" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><text x="630" y="143" font-size="22" text-anchor="middle" fill="#0f172a">Mix with water</text><rect x="530" y="265" width="200" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><text x="630" y="308" font-size="22" text-anchor="middle" fill="#0f172a">Filter</text><rect x="290" y="265" width="200" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><text x="390" y="308" font-size="22" text-anchor="middle" fill="#0f172a">Press</text><rect x="50" y="265" width="200" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><text x="150" y="308" font-size="22" text-anchor="middle" fill="#0f172a">Dry</text><rect x="50" y="410" width="200" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><text x="150" y="453" font-size="22" text-anchor="middle" fill="#0f172a">Roll new paper</text><path d="M250 135 L285 135" fill="none" stroke="#0369A1" stroke-width="3"/><text x="285" y="141" font-size="28" text-anchor="middle" fill="#0369A1">›</text><path d="M490 135 L525 135" fill="none" stroke="#0369A1" stroke-width="3"/><text x="525" y="141" font-size="28" text-anchor="middle" fill="#0369A1">›</text><path d="M630 170 L630 260" fill="none" stroke="#0369A1" stroke-width="3"/><text x="630" y="266" font-size="28" text-anchor="middle" fill="#0369A1">↓</text><path d="M530 300 L495 300" fill="none" stroke="#0369A1" stroke-width="3"/><text x="495" y="306" font-size="28" text-anchor="middle" fill="#0369A1">‹</text><path d="M290 300 L255 300" fill="none" stroke="#0369A1" stroke-width="3"/><text x="255" y="306" font-size="28" text-anchor="middle" fill="#0369A1">‹</text><path d="M150 335 L150 405" fill="none" stroke="#0369A1" stroke-width="3"/><text x="150" y="411" font-size="28" text-anchor="middle" fill="#0369A1">↓</text><path d="M390 170 L390 215" fill="none" stroke="#991B1B" stroke-width="3"/><text x="390" y="240" font-size="19" text-anchor="middle" fill="#991B1B">Rejected material</text><text x="530" y="455" font-size="18" text-anchor="middle" fill="#0f172a">Main sequence follows the arrows.</text></g></svg>